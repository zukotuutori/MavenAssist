        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- update badge: arrow up -->
  <circle cx="30.5" cy="29.5" r="8" fill="url(#badge)" stroke="#FFFFFF" stroke-width="1.6"/>
  <path d="M30.5 33.5 V26.6 M27.2 29.6 L30.5 26.2 L33.8 29.6"
